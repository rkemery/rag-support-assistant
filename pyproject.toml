[project]
name = "neobank-support-data"
version = "0.1.0"
description = "Synthetic customer-support dataset for Tallowbrook, a fictional neobank: help-center corpus, RAG questions and agent tasks."
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
